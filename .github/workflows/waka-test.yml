name: Waka test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "last4=${KEY: -4}"
          curl -s -i -H "Authorization: Basic $(printf %s "$KEY" | base64 -w0)" "https://wakatime.com/api/v1/users/current/stats/last_7_days" | head -c 1500
        env:
          KEY: ${{ secrets.WAKATIME_API_KEY }}
